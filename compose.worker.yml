name: 4short-worker

services:
  media-worker:
    env_file:
      - /etc/4short/media-worker.env
      # Atomically replaced by the privileged deployer before a release. It
      # must survive Docker/host restarts after GitHub removes its /tmp upload.
      - /etc/4short/worker-api-token.env
    environment:
      # The deployer derives this from the exact local OCI image ID. It is
      # diagnostic at runtime and makes hardware benchmark evidence reject a
      # report from an unknown/mutable image.
      FOURSHORT_WORKER_IMAGE_DIGEST: ${FOURSHORT_WORKER_IMAGE_DIGEST:-}
    # Both Timeweb hosts are attached to the same private network. Keep the
    # public hostname for TLS/SNI, but send service-to-service traffic directly
    # to the control plane instead of hairpinning through the public Internet.
    extra_hosts:
      - "api.hashpix.ru:192.168.0.4"
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    image: 4short/media-worker:${FOURSHORT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - /var/lib/4short/jobs:/var/lib/4short/jobs
      # Operator-owned benchmark and release evidence. It is separate from
      # job scratch so normal per-job cleanup cannot erase a hardware sample.
      - /var/lib/4short/reports:/var/lib/4short/reports
      # The worker is non-root and consumes a root-owned immutable model pack.
      # Model provisioning is an explicit maintenance command, not a job-time
      # network fallback.
      - /var/lib/4short/models:/var/lib/4short/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 10g
    cpus: 7.5
    pids_limit: 768
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path;import sys,time;p=Path('/tmp/4short-worker-ready');sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<120 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
