name: 4short-worker

services:
  media-worker:
    env_file:
      - /etc/4short/media-worker.env
      # Staged by the deployment workflow; the file is removed after Docker
      # has copied the value into the container configuration.
      - /tmp/4short-worker-api-token.env
    environment:
      HF_HOME: /var/lib/4short/models/huggingface
      HF_HUB_CACHE: /var/lib/4short/models/huggingface/hub
      HF_HUB_DISABLE_XET: "1"
      XDG_CACHE_HOME: /var/lib/4short/models/cache
    # Both Timeweb hosts are attached to the same private network. Keep the
    # public hostname for TLS/SNI, but send service-to-service traffic directly
    # to the control plane instead of hairpinning through the public Internet.
    extra_hosts:
      - "api.4short.ru:192.168.0.4"
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    image: 4short/media-worker:${FOURSHORT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - /var/lib/4short/jobs:/var/lib/4short/jobs
      - /var/lib/4short/models:/var/lib/4short/models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 10g
    cpus: 7.5
    pids_limit: 768
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path;import sys,time;p=Path('/tmp/4short-worker-ready');sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<120 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
