[project]
name = "fourshort-media-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.40.61",
  "faster-whisper==1.2.1",
  "huggingface-hub==0.34.4",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "psutil==7.1.0",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "yt-dlp==2026.7.4"
]

[project.scripts]
fourshort-worker = "fourshort_worker.main:main"
fourshort-model-sync = "fourshort_worker.model_sync:main"
fourshort-active-speaker-evidence = "fourshort_worker.active_speaker_evidence:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
