[project]
name = "fourshort-hve-evaluator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "mediapipe==0.10.18",
  "sherpa-onnx==1.13.4"
]

[project.scripts]
fourshort-hve-active-speaker-candidate = "hve_evaluator.active_speaker_candidate:main"
fourshort-hve-active-speaker-bundle = "hve_evaluator.prediction_bundle:main"
fourshort-hve-layout-candidate = "hve_evaluator.layout_candidate:main"
fourshort-hve-layout-bundle = "hve_evaluator.layout_prediction_bundle:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
