name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS WORKER_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Production deployment secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare release archive
        run: git archive --format=tar.gz --output="/tmp/4short-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
        run: |
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf 'WORKER_API_TOKEN=%s\n' "${WORKER_API_TOKEN}" > /tmp/4short-worker-api-token.env
          chmod 0600 /tmp/4short-worker-api-token.env

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_STAGING_DIR: /home/deploy/.shortpix-worker-staging
        run: |
          ssh -o BatchMode=yes \
            "deploy@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_STAGING_DIR}' && chmod 700 '${DEPLOY_STAGING_DIR}'"

          scp \
            -o BatchMode=yes \
            "/tmp/4short-${GITHUB_SHA}.tar.gz" "/tmp/4short-worker-api-token.env" \
            "deploy@${DEPLOY_HOST}:${DEPLOY_STAGING_DIR}/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_STAGING_DIR: /home/deploy/.shortpix-worker-staging
        run: |
          ssh -o BatchMode=yes "deploy@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/4short-deploy '${GITHUB_SHA}' '${DEPLOY_STAGING_DIR}/4short-${GITHUB_SHA}.tar.gz'"

      - name: Remove staged secret
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_STAGING_DIR: /home/deploy/.shortpix-worker-staging
        run: |
          ssh -o BatchMode=yes "deploy@${DEPLOY_HOST}" \
            "rm -f '${DEPLOY_STAGING_DIR}/4short-worker-api-token.env' '${DEPLOY_STAGING_DIR}/4short-${GITHUB_SHA}.tar.gz'" || true
