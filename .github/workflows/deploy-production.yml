name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release archive
        run: git archive --format=tar.gz --output="/tmp/4short-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp \
            -o BatchMode=yes \
            "/tmp/4short-${GITHUB_SHA}.tar.gz" \
            "deploy@${DEPLOY_HOST}:/tmp/4short-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o BatchMode=yes "deploy@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/4short-deploy '${GITHUB_SHA}' '/tmp/4short-${GITHUB_SHA}.tar.gz'"
