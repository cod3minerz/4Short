name: Complete media worker install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate temporary install secrets
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_ROOT_PASSWORD: ${{ secrets.WORKER_ROOT_PASSWORD }}
          WORKER_DEPLOY_PRIVATE_KEY: ${{ secrets.WORKER_DEPLOY_PRIVATE_KEY }}
          WORKER_ENV_FILE: ${{ secrets.WORKER_ENV_FILE }}
        run: |
          missing=0
          for name in WORKER_HOST WORKER_ROOT_PASSWORD WORKER_DEPLOY_PRIVATE_KEY WORKER_ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::Temporary install secret ${name} is not configured"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure SSH
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_DEPLOY_PRIVATE_KEY: ${{ secrets.WORKER_DEPLOY_PRIVATE_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${WORKER_DEPLOY_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "${WORKER_HOST}" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Stage deployer and environment
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_ENV_FILE: ${{ secrets.WORKER_ENV_FILE }}
        run: |
          printf '%s\n' "${WORKER_ENV_FILE}" > /tmp/media-worker.env
          chmod 0600 /tmp/media-worker.env
          scp -o BatchMode=yes infra/worker/bin/4short-worker-deploy \
            "deploy@${WORKER_HOST}:/tmp/4short-worker-deploy"
          scp -o BatchMode=yes /tmp/media-worker.env \
            "deploy@${WORKER_HOST}:/tmp/media-worker.env"

      - name: Install root-owned production files
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          WORKER_ROOT_PASSWORD: ${{ secrets.WORKER_ROOT_PASSWORD }}
        run: |
          printf '%s\n' "${WORKER_ROOT_PASSWORD}" | ssh -tt -o BatchMode=yes "deploy@${WORKER_HOST}" \
            "su -c 'install -m 0750 -o root -g root /tmp/4short-worker-deploy /usr/local/sbin/4short-worker-deploy && install -m 0600 -o root -g root /tmp/media-worker.env /etc/4short/media-worker.env' root"

      - name: Verify deploy command is authorized
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
        run: |
          set +e
          ssh -o BatchMode=yes "deploy@${WORKER_HOST}" \
            "sudo /usr/local/sbin/4short-worker-deploy invalid invalid"
          status=$?
          set -e
          test "${status}" -eq 2

      - name: Preserve pinned host key
        uses: actions/upload-artifact@v4
        with:
          name: worker-known-hosts
          path: ~/.ssh/known_hosts
          if-no-files-found: error
          retention-days: 1
