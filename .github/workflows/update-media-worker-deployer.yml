name: Update media worker deployer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          KEY: ${{ secrets.WORKER_DEPLOY_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.WORKER_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519
      - name: Install updated deployer
        env:
          HOST: ${{ secrets.WORKER_HOST }}
          ROOT_PASSWORD: ${{ secrets.WORKER_ROOT_PASSWORD }}
        run: |
          test -n "${ROOT_PASSWORD}"
          scp -o BatchMode=yes infra/worker/bin/4short-worker-deploy \
            "deploy@${HOST}:/tmp/4short-worker-deploy"
          printf '%s\n' "${ROOT_PASSWORD}" | ssh -tt -o BatchMode=yes "deploy@${HOST}" \
            "su -c 'install -m 0750 -o root -g root /tmp/4short-worker-deploy /usr/local/sbin/4short-worker-deploy' root"
