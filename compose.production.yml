name: 4short

x-control-environment: &control-environment
  env_file:
    - /etc/4short/control-api.env

services:
  migrate:
    <<: *control-environment
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    image: 4short/control-api:${FOURSHORT_IMAGE_TAG:-local}
    command:
      - node
      - services/control-api/dist/services/control-api/src/migrate.js
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  control-api:
    <<: *control-environment
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    image: 4short/control-api:${FOURSHORT_IMAGE_TAG:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:4100:4100
    networks:
      - backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  media-worker:
    env_file:
      - /etc/4short/media-worker.env
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    image: 4short/media-worker:${FOURSHORT_IMAGE_TAG:-local}
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - /var/lib/4short/jobs:/var/lib/4short/jobs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4608m
    cpus: 3.0
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import psutil,sys;sys.exit(0 if any('fourshort-worker' in ' '.join(p.cmdline()) for p in psutil.process_iter()) else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  backend:
    driver: bridge
