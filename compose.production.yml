name: 4short

x-control-environment: &control-environment
    env_file:
      - /etc/4short/database.env
      - /etc/4short/control-api.env
      # Scoped object-store credentials stay separate from app configuration
      # and are installed root-owned with mode 0600 on the host.
      - /etc/4short/s3.env
      # Deployment-owned override. It is staged with mode 0600 for each release
      # so the control API and remote media workers always share one token.
      - /home/deploy/.shortpix-worker-staging/4short-worker-api-token.env

services:
  migrate:
    <<: *control-environment
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    image: 4short/control-api:${FOURSHORT_IMAGE_TAG:-local}
    command:
      - node
      - services/control-api/dist/services/control-api/src/migrate.js
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  control-api:
    <<: *control-environment
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    image: 4short/control-api:${FOURSHORT_IMAGE_TAG:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:4100:4100
    networks:
      backend: {}
      edge:
        aliases:
          - narezai-control-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:
    driver: bridge
  # Isolated edge network shared only with the existing Caddy service.
  # Do not attach Narezai to creodock_edge, which contains other applications.
  edge:
    name: ${NAREZAI_EDGE_NETWORK:-narezai_edge}
    external: true
