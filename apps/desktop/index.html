<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narezai Spike</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
    button { padding: 8px 12px; margin: 0 8px 8px 0; cursor: pointer; }
    .stage { position: relative; display: inline-block; max-width: 100%; }
    video { max-width: 100%; max-height: 360px; background: #000; display: block; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    pre { background: #1c1c1c; padding: 12px; white-space: pre-wrap; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <h3>Narezai: техническая проверка (спайк)</h3>
  <button id="sys">1. Система</button>
  <button id="pick">2. Выбрать видео</button>
  <button id="seek">3. Тест перемотки</button>
  <button id="ff">4. ffmpeg -version</button>
  <button id="probe">5. ffprobe выбранного файла</button>
  <div class="stage"><video id="v" controls muted></video><canvas id="c"></canvas></div>
  <pre id="log"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
